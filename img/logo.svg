<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dreaming Wiki logo: sleeping moon over wiki lines -->
  <defs>
    <mask id="mooncut">
      <rect x="0" y="0" width="512" height="512" fill="white"/>
      <circle cx="321" cy="172" r="104" fill="black"/>
    </mask>
  </defs>
  <!-- badge -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#0B0E14"/>
  <!-- crescent moon -->
  <circle cx="256" cy="208" r="118" fill="#F5F0E8" mask="url(#mooncut)"/>
  <!-- sleep: z z -->
  <g stroke="#007A8C" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="330,84 372,84 330,126 372,126"/>
    <polyline points="392,132 420,132 392,158 420,158" stroke-width="9"/>
  </g>
  <!-- star -->
  <path d="M448,52 l4,14 14,4 -14,4 -4,14 -4,-14 -14,-4 14,-4 z" fill="#007A8C"/>
  <!-- wiki lines -->
  <rect x="138" y="345" width="236" height="18" rx="9" fill="#F5F0E8"/>
  <rect x="160" y="383" width="192" height="18" rx="9" fill="#F5F0E8" opacity="0.75"/>
  <rect x="182" y="421" width="148" height="18" rx="9" fill="#007A8C"/>
</svg>
